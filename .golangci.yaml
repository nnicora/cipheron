version: "2"

run:
  concurrency: 4
  timeout: 10m
  # Exclusion paths below are relative to the directory holding go.mod, wherever the linter runs from.
  relative-path-mode: gomod

linters:
  # An explicit list, not `default: all` minus a disable list: a linter absent from this list is off, an
  # upgrade cannot add one, and adding one is a decision.
  #
  # Never run with --fix: rewriting linters (modernize, intrange, fatcontext's fixer, embedlit) have produced
  # silent semantic changes — a captured variable turned into a shadowing local, a loop variable's type changed.
  # Report, then edit by hand. `golangci-lint fmt` (formatting only) is safe.
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Correctness: things that are bugs, not opinions.
    - asasalint # []any passed to a variadic any
    - bidichk # bidirectional unicode that can hide code from a reviewer
    - durationcheck # multiplying two Durations
    - errchkjson # json.Marshal errors that cannot be ignored
    - errorlint # %v on an error, == comparisons that break wrapping
    - fatcontext # a context created inside a loop, then reused outside it
    - forcetypeassert # unchecked x.(T)
    - makezero # append to a make()d slice that already has length
    - nilnil # returning (nil, nil)
    - noctx # HTTP requests with no context
    - reassign # assigning to another package's exported variable
    - wastedassign # a value assigned and then overwritten unread

    # This codebase in particular.
    - goconst
    - protogetter # direct field access where a generated getter handles nil

    # Clarity, cheap and mechanical.
    - copyloopvar
    - dogsled
    - embeddedstructfieldcheck
    - errname
    - iface
    - inamedparam
    - interfacebloat
    - mirror
    - misspell
    - nakedret
    - perfsprint
    - predeclared
    - unconvert
    - usestdlibvars
    - whitespace

    # Tests.
    - paralleltest
    - testifylint
    - thelper

    # The suppressions themselves: a //nolint that names no linter, or is no longer needed, is reported.
    - nolintlint
  settings:
    interfacebloat:
      max: 25
    dogsled:
      max-blank-identifiers: 4
    paralleltest:
      ignore-missing: true
      ignore-missing-subtests: true
    testifylint:
      disable:
        - require-error
    staticcheck:
      # Setting `checks` replaces golangci-lint's default list: the six ST codes are that default.
      # QF1008 (drop an embedded field from a selector) and QF1001 (De Morgan) are refactoring suggestions: the
      # qualifier keeps a selector from silently re-binding when the outer type grows a same-named member, and
      # the allow-list form of an input check is the readable one.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
        - -QF1001
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Fixture strings repeat by nature; hoisting them to constants makes a test harder to read.
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - ^third_party/
      - node_modules
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/nnicora/cipheron)
        - blank
        - dot
        - alias
        - localmodule
  exclusions:
    generated: lax
    paths:
      - ^third_party/
      - node_modules
